plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.chazpounder78.keylightkeeper'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.chazpounder78.keylightkeeper"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
